                    // AI Prediction Form Logic
        document.getElementById('prediction-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form values
            const origin = document.getElementById('origin').value;
            const destination = document.getElementById('destination').value;
            const departure = document.getElementById('departure').value;
            const returnDate = document.getElementById('return').value;
            const budget = parseInt(document.getElementById('budget').value);
            const email = document.getElementById('email').value;
            
            // Simulate AI prediction with realistic calculations
            const basePrice = Math.floor(Math.random() * (12000 - 4000) + 4000);
            const priceVariation = Math.floor(Math.random() * 2000 - 1000);
            const predictedPrice = basePrice + priceVariation;
            
            // Calculate trend
            let trend = '—';
            let trendClass = '';
            if (predictedPrice < basePrice) {
                trend = '↓';
                trendClass = 'down';
            } else if (predictedPrice > basePrice) {
                trend = '↑';
                trendClass = 'up';
            }
            
            // Calculate confidence
            const confidence = Math.floor(Math.random() * (85 - 65) + 65);
            
            // Generate recommendation
            let recommendation = '';
            if (predictedPrice < budget * 0.9) {
                recommendation = `🎯 <strong>Book Now!</strong> The current price of ₹${basePrice.toLocaleString()} is ${Math.round((1 - basePrice/budget) * 100)}% below your target. Our AI predicts this is near the floor price with ${confidence}% confidence. Prices are likely to increase in the next 3-5 days.`;
            } else if (predictedPrice < budget) {
                recommendation = `⚠️ <strong>Good Deal - Consider Booking.</strong> The price is within your budget at ₹${basePrice.toLocaleString()}. While we predict a slight increase of ₹${Math.abs(priceVariation).toLocaleString()}, this is still a reasonable time to book with ${confidence}% confidence.`;
            } else {
                recommendation = `⏳ <strong>Wait for Better Prices.</strong> Current price of ₹${basePrice.toLocaleString()} is ${Math.round((basePrice/budget - 1) * 100)}% above your target budget. Our AI predicts prices may drop by ₹${Math.abs(priceVariation).toLocaleString()} in the next 7-10 days. We'll monitor and alert you when it reaches ₹${budget.toLocaleString()}.`;
            }
            
            // Display results
            document.getElementById('current-price').textContent = '₹' + basePrice.toLocaleString();
            document.getElementById('predicted-price').textContent = '₹' + predictedPrice.toLocaleString();
            document.getElementById('price-trend').textContent = trend;
            document.getElementById('price-trend').className = 'result-value trend ' + trendClass;
            document.getElementById('confidence').textContent = confidence + '%';
            document.getElementById('recommendation').innerHTML = recommendation;
            
            // Show results with animation
            const resultDiv = document.getElementById('prediction-result');
            resultDiv.style.display = 'block';
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            
            // Simulate email alert confirmation
            setTimeout(() => {
                alert(`✅ Tracking activated! We'll send price alerts to ${email} for ${origin} → ${destination} on ${departure}.`);
            }, 1000);
        });
    </script>
